<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0a">
<meta name="description" content="Add one idea to the flywheel of the universe.">
<title>NOTHING</title>
<style>
:root{--bg:#0b0b0a;--ink:#e9e7df;--muted:#77756e;--line:#292824}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{font-family:"Courier New",Courier,monospace;min-height:100svh}
button,textarea{font:inherit}.screen{min-height:100svh;width:min(760px,100%);margin:auto;padding:32px 24px;display:flex;flex-direction:column}
.invite{justify-content:center}.word{font-family:"Lucida Console","Courier New",monospace;font-size:clamp(58px,14vw,118px);line-height:.85;letter-spacing:-.055em;margin:0 0 34px;font-weight:700;font-stretch:condensed}
.line{font-size:clamp(16px,2.8vw,21px);line-height:1.55;max-width:600px;margin:0;color:#c9c6bd}
.enter,.send{margin-top:36px;width:max-content;border:1px solid var(--line);background:transparent;color:var(--ink);padding:12px 18px;cursor:pointer;text-transform:uppercase;letter-spacing:.12em;font-size:12px}
.enter:hover,.send:hover{background:var(--ink);color:var(--bg)}.terminal{display:none;justify-content:center}.terminal.open{display:flex}.invite.hidden{display:none}
.prompt{font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:20px}
textarea{width:100%;min-height:230px;resize:none;border:0;border-left:1px solid var(--line);outline:0;background:transparent;color:var(--ink);padding:4px 0 4px 18px;font-size:clamp(18px,3vw,24px);line-height:1.55;caret-color:var(--ink)}
textarea::placeholder{color:#44433f}.meta{display:flex;justify-content:space-between;align-items:center;gap:16px}.count{font-size:11px;color:#55534e;margin-top:36px}.send:disabled{opacity:.3;cursor:default}
.home{display:none;justify-content:center;align-items:flex-start;padding-top:42vh}.home.open{display:flex}.home h1{font-size:clamp(46px,11vw,90px);letter-spacing:-.06em;margin:0}
.error{min-height:18px;color:#8f7c74;font-size:12px;margin-top:16px}
@media(max-width:520px){.screen{padding:24px 18px}.word{margin-bottom:28px}textarea{min-height:260px}}
</style>
</head>
<body>
<section class="screen invite" id="invite">
  <h1 class="word">NOTHING</h1>
  <p class="line">Add one idea to the flywheel of the universe.</p>
  <button class="enter" id="enter">Enter</button>
</section>
<section class="screen terminal" id="terminal">
  <div>
    <div class="prompt">ONE IDEA</div>
    <textarea id="idea" maxlength="2000" autofocus placeholder=">"></textarea>
    <div class="meta"><button class="send" id="send">Send</button><span class="count" id="count">0 / 2000</span></div>
    <div class="error" id="error"></div>
  </div>
</section>
<section class="screen home" id="home"><h1>GO HOME.</h1></section>
<script>
const SUPABASE_URL='https://znzoepudtfpsxoglkyia.supabase.co';
const SUPABASE_KEY='sb_publishable_XySCbewhCGiQXPGMui5peA_SiZz0VqA';
const invite=document.getElementById('invite'),terminal=document.getElementById('terminal'),home=document.getElementById('home');
const idea=document.getElementById('idea'),send=document.getElementById('send'),count=document.getElementById('count'),error=document.getElementById('error');
document.getElementById('enter').onclick=()=>{invite.classList.add('hidden');terminal.classList.add('open');setTimeout(()=>idea.focus(),50)};
idea.oninput=()=>count.textContent=idea.value.length+' / 2000';
send.onclick=async()=>{
 const text=idea.value.trim(); if(!text)return;
 send.disabled=true;error.textContent='';
 try{
  const r=await fetch(SUPABASE_URL+'/rest/v1/nothing_ideas',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({idea:text})});
  if(!r.ok)throw new Error();
  terminal.classList.remove('open');home.classList.add('open');idea.value='';
 }catch(e){error.textContent='Could not send. Try once more.';send.disabled=false}
};
</script>
</body>
</html>
